name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip3 install --user --upgrade buildozer
        pip3 install --user --upgrade cython virtualenv

    # 👇 الحل النهائي: البحث عن sdkmanager ونسخه إلى المكان الصحيح
    - name: Setup Android SDK and Accept Licenses
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O $HOME/commandlinetools.zip
        unzip -q $HOME/commandlinetools.zip -d $HOME/.buildozer/android/platform/android-sdk
        
        # البحث عن sdkmanager في أي مكان ونسخه إلى مجلد tools/bin
        SDKMANAGER_PATH=$(find $HOME/.buildozer/android/platform/android-sdk -name "sdkmanager" -type f | head -n 1)
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
        cp $SDKMANAGER_PATH $HOME/.buildozer/android/platform/android-sdk/tools/bin/
        
        # قبول التراخيص
        echo "y" | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
